name: Frontend CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build:homologacao
        env:
          VITE_API_URL: http://127.0.0.1:4174/api
          VITE_FIREBASE_API_KEY: synthetic-test-api-key
          VITE_FIREBASE_PROJECT_ID: rm-control-test
          VITE_FIREBASE_AUTH_DOMAIN: rm-control-test.firebaseapp.com
          VITE_FIREBASE_APP_ID: synthetic-app
      - run: npm run test:e2e:auth
  browser-api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: rm_control_test
        options: >-
          --health-cmd "pg_isready -U postgres -d rm_control_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/rm_control_test
      RM_MODE: local
      RM_FIREBASE_PROJECT_ID: rm-control-test
      CORS_ORIGINS: http://127.0.0.1:4175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pethersonzada/rm-control-backend
          ref: 66e7604613982fcb96f8d9e47edd8ee2311bb875
          path: integration-backend
          persist-credentials: false
      - name: Prepare isolated paths
        run: |
          echo "RM_BACKEND_DIR=$RUNNER_TEMP/rm-backend" >> "$GITHUB_ENV"
          echo "RM_INTEGRATION_FIXTURES=$RUNNER_TEMP/rm-fixtures" >> "$GITHUB_ENV"
          mv integration-backend "$RUNNER_TEMP/rm-backend"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r "$RM_BACKEND_DIR/requirements.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:homologacao
        env:
          VITE_API_URL: http://127.0.0.1:8001
          VITE_FIREBASE_API_KEY: synthetic-test-api-key
          VITE_FIREBASE_PROJECT_ID: rm-control-test
          VITE_FIREBASE_AUTH_DOMAIN: rm-control-test.firebaseapp.com
          VITE_FIREBASE_APP_ID: synthetic-app
      - name: Real API integration (synthetic identity)
        shell: bash
        run: |
          python scripts/integration_server.py > "$RUNNER_TEMP/rm-integration.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8001/ready >/dev/null; then break; fi
            if ! kill -0 "$PID" 2>/dev/null; then cat "$RUNNER_TEMP/rm-integration.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/ready
          npx playwright test -c playwright.integration.config.ts
